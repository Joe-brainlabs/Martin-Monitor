# Martin Monitor: what we watch, how often, and how items get tagged.
# Cadences are minutes. A source with a missing key is skipped, not an error.
# Current setting: everything daily, until the pitch cadence is agreed.

x:
  every_minutes: 1440
  initial_max: 20          # tweets per handle on the very first run (each tweet read costs $0.005)
  handles:
    - handle: MartinSLewis
      label: Martin Lewis on X
    - handle: MoneySavingExp
      label: MoneySavingExpert on X

instagram:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: Martin Lewis on Instagram
  chunk_size: 10           # EnsembleData charges 1 unit per 10 posts; the trial allows 50 units a day
  depth: 1
  accounts:
    - username: martinlewismse

mse_news:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: MSE news
  feed: https://www.moneysavingexpert.com/news/feeds/news.rss

mse_forum:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: MSE forum
  per_board: 50
  boards:
    21: Insurance & life assurance
    13: Energy
    29: Techie Stuff
    69: Broadband & internet access
    11: Credit cards
    143: Pets & pet care

press:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: National press
  queries:
    - '"Martin Lewis"'

reddit:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: Reddit
  subreddits: [UKPersonalFinance, AskUK]
  sort: new
  period: day
  pages: 3                  # 25 posts a page, about 2 EnsembleData units a page
  mention_terms: [martin lewis, moneysavingexpert, money saving expert, mse]
  # Posts that mention Martin or MSE are always kept. A post that only matches a CTM category keyword is
  # kept when it is loud enough to count as a demand signal:
  min_score: 20
  min_comments: 20

youtube:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: YouTube
  channel_id: UC5CDoveqvEuQsW3x-DnYtww

trends:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: Google Trends (worldwide)
  geo: WORLD               # Decodo rejects geo on this target, so the series is worldwide by decision (30 Sep 2026)
  recent_days: 30          # a second, daily-resolution pull for the recent view
  terms:
    - {term: cheap car insurance, topic: car}
    - {term: car insurance renewal, topic: car}
    - {term: home insurance quotes, topic: home}
    - {term: best broadband deals, topic: broadband}
    - {term: energy price cap, topic: energy}
    - {term: pet insurance cost, topic: pet}
    - {term: life insurance uk, topic: life}
    - {term: travel insurance uk, topic: travel}
    - {term: health insurance uk, topic: health}
    - {term: business insurance uk, topic: business}
    - {term: sim only deals, topic: phones}
    - {term: balance transfer credit card, topic: credit_cards}
    - {term: switch bank account, topic: current_accounts}
    - {term: remortgage, topic: mortgages}
    - {term: personal loan uk, topic: loans}

mse_guides:
  every_minutes: 1440       # daily for now (Joe, 30 Sep 2026); see PLAN.md for the target cadence
  label: MSE guide changes
  urls:
    - https://www.moneysavingexpert.com/insurance/car-insurance/
    - https://www.moneysavingexpert.com/insurance/home-insurance/
    - https://www.moneysavingexpert.com/utilities/
    - https://www.moneysavingexpert.com/credit-cards/
    - https://www.moneysavingexpert.com/insurance/travel-insurance/
    - https://www.moneysavingexpert.com/insurance/cut-pet-insurance-costs/

# Brian: the scheduled pass that writes a view on new items and the hourly digest. Only spends when
# there is something new. Items from auto_sources always get a view; forum and Reddit threads need the
# comment count shown; press stories need a CTM category tag. Anything else is on request from the page.
brian:
  every_minutes: 60
  label: Brian
  model: claude-opus-5-5
  per_run_cap: 25
  auto_sources: [x_martinslewis, instagram, x_moneysavingexp, mse_news, mse_guides]
  loud_sources: {mse_forum: 20, reddit: 20}
  press_with_topic: true
  digest_hours: 24
  ask_per_hour: 20           # live questions per caller per hour
  views_per_hour: 30         # on-request views per caller per hour

# CTM product categories: one per sub-brand in the CTM dashboard (ctm-dashboard/src/data/verticals.json),
# in the same order and with the same names. An item gets a category when its title or text contains any
# phrase as a whole word, case-insensitive, with plurals allowed ("credit card" also matches "credit cards").
topic_labels:
  car: Car
  home: Home
  pet: Pet
  life: Life
  travel: Travel
  health: Health
  business: Business
  energy: Energy
  broadband: Broadband
  phones: Phones
  credit_cards: Credit cards
  current_accounts: Current accounts
  mortgages: Mortgages
  loans: Loans

topics:
  car: [car insurance, motor insurance, car cover, black box insurance, telematics, van insurance, bike insurance, motorbike insurance, learner driver insurance, no claims discount, no claims bonus]
  home: [home insurance, contents insurance, buildings insurance, home cover, landlord insurance, home emergency cover]
  pet: [pet insurance, vet bill, vet fee, vet cost]
  life: [life insurance, life cover, life assurance, critical illness cover, income protection, term insurance]
  travel: [travel insurance, ghic, ehic, holiday cover, travel cover]
  health: [health insurance, private medical insurance, private health cover, dental insurance, health cash plan]
  business: [business insurance, public liability, professional indemnity, business energy, business broadband, employers liability]
  energy: [energy, energy bill, price cap, ofgem, electricity, gas bill, standing charge, smart meter, fixed tariff, energy tariff, energy supplier, warm home discount]
  broadband: [broadband, wifi, wi-fi, full fibre, fibre broadband, internet provider, mid-contract price rise]
  phones: [sim only, sim-only, mobile contract, phone contract, mobile phone deal, phone deal, mobile network, roaming charge, handset, mid-contract price rise]
  credit_cards: [credit card, balance transfer, 0% card, purchase card, section 75, credit score, credit file, credit report]
  current_accounts: [current account, bank account, switching bonus, bank switching, switch bank, current account switch, overdraft]
  mortgages: [mortgage, remortgage, remortgaging, first-time buyer, mortgage rate, base rate]
  loans: [personal loan, unsecured loan, debt consolidation, car loan, guarantor loan, loan rate]

# Martometer: how relevant an item is to CTM's business, 0 to 10, shown on every card.
#   Martometer = 10 x Martin x CTM
#   Martin = voice x (reach_floor + (1 - reach_floor) x reach)     who is speaking, scaled by how far it travelled
#   CTM    = Brian's relevance call when he has read the item, otherwise how many CTM categories the keywords matched
# The Sources tab explains the formula from these numbers, so edit here and the page follows.
martometer:
  hide_below: 3.0            # the feed hides items under this unless "Show low relevance" is switched on
  voice:                     # who is speaking, 0 to 1
    martin: 1.0              # Martin's own channels: X, Instagram, YouTube
    mse: 0.85                # MSE's official output: MSE on X, MSE news, guide changes
    press: 0.7               # a national press story about him
    names_martin: 0.75       # a forum or Reddit thread that names Martin or MSE
    forum: 0.25              # any other MSE forum thread
    reddit: 0.15             # any other Reddit post
  mention_terms: [martin lewis, martin, money show, moneysavingexpert, money saving expert]
  reach_floor: 0.5           # a post nobody has seen keeps half its voice score; reach decides the other half
  reach_refs:                # what counts as a typical post (reach 0.5) and a big day (reach 1.0) for each source, log scale.
    x: {typical: 50000, big: 1000000}          # impressions (likes x 100 when impressions are missing)
    instagram: {typical: 200000, big: 1500000} # plays (likes x 15 for a photo)
    youtube: {typical: 40000, big: 500000}     # views
    mse_forum: {typical: 5, big: 100}          # comments
    reddit: {typical: 30, big: 1000}           # points plus comments
  ctm_brian: {none: 0.05, low: 0.35, medium: 0.7, high: 1.0}    # when Brian has read it, his call wins
  ctm_keywords: {0: 0.1, 1: 0.6, 2: 0.75}                        # otherwise: CTM categories matched by keyword (2 means two or more)
