<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Martin Monitor</title>
  <link rel="icon" type="image/png" href="brian.png">
  <link rel="stylesheet" href="fonts/figtree.css">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="wordmark">Martin Monitor</span>
      <span class="brand__sub">What Martin Lewis and MSE are saying, and where it is spreading</span>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="live-text">Connecting…</span></div>
  </header>

  <main>
    <section class="summary" id="summary" aria-label="Sources"></section>

    <section class="toolbar">
      <div class="filters" id="source-filters" aria-label="Filter by source"></div>
      <div class="filters filters--topics" id="topic-filters" aria-label="Filter by topic"></div>
    </section>

    <section class="feed" id="feed" aria-live="polite"></section>
  </main>

  <footer class="health" id="health"></footer>
  <script src="app.js"></script>
</body>
</html>
